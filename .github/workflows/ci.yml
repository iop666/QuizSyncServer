name: CI（.NET 构建 / 格式 / 测试；还没有工程文件时跳过）

# 本仓库目前是 Phase 0 骨架（只有 README 与 src/、tests/ 占位目录）。
# 用 hashFiles 探测 *.sln / *.csproj：有工程文件才装 SDK、构建、格式检查、测试；
# 没有就打印一行跳过并**成功退出** —— 将来往 src/ 里加代码不用改本文件。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支/PR 的新推送取消旧运行
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET 构建与测试
    runs-on: windows-latest # 目标形态是 Windows 上的 CLI 与可内嵌库
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 探测 .NET 工程文件
        id: probe
        shell: bash
        # hashFiles 判断「仓库里有没有工程文件」；顺带挑一个目标（先 .sln 再 .csproj），
        # 工程放到 src/ 的哪个子目录都不用改 CI。
        run: |
          if [ -n "${{ hashFiles('**/*.sln', '**/*.csproj') }}" ]; then
            target="$(find . -path ./.git -prune -o -name '*.sln' -print | sort | sed -n '1p')"
            if [ -z "$target" ]; then
              target="$(find . -path ./.git -prune -o -name '*.csproj' -print | sort | sed -n '1p')"
            fi
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "target=$target" >> "$GITHUB_OUTPUT"
            echo "找到工程文件：$target"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::仓库里还没有 *.sln / *.csproj，跳过 .NET 构建、格式检查与测试（成功）"
          fi

      - name: 安装 .NET SDK
        if: steps.probe.outputs.found == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x # README 第 7 节：Phase 2 起用 .NET 10 LTS

      - name: 构建
        if: steps.probe.outputs.found == 'true'
        run: dotnet build "${{ steps.probe.outputs.target }}" --configuration Release

      - name: 格式检查
        if: steps.probe.outputs.found == 'true'
        run: dotnet format "${{ steps.probe.outputs.target }}" --verify-no-changes

      - name: 测试
        if: steps.probe.outputs.found == 'true'
        run: dotnet test "${{ steps.probe.outputs.target }}" --configuration Release --no-build

      - name: 无工程文件 → 跳过
        if: steps.probe.outputs.found != 'true'
        run: echo "本仓库暂无 *.sln / *.csproj：CI 跳过 .NET 步骤并成功退出。"
